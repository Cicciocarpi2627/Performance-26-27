name: Aggiorna dashboard GPS e Strength da Google Drive
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [drive-updated]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Scarica XLSX da OneDrive
        run: wget -q "https://onedrive.live.com/personal/766ff0e2a8280a5b/_layouts/15/doc.aspx?resid=fbc9b6c1-ad69-4341-804b-552ae5b6a1c0&cid=766ff0e2a8280a5b" -O nome_file.xlsx
      - name: Installa dipendenze
        run: pip install pandas openpyxl gdown
      - name: Scarica XLSX GPS da Google Drive
        run: gdown "https://drive.google.com/uc?id=1KcF1dXYJLAb_XQkVQMJUSnOKaw6wrSdy" -O dati.xlsx
      - name: Aggiorna gps-dashboard.html
        run: python genera_html.py dati.xlsx gps-dashboard.html
      - name: Scarica XLSX Strength da Google Sheets
        run: wget -q "https://docs.google.com/spreadsheets/d/1TO1EJFeqRD4wlL3_mgxZ6auQ78kx44ox/export?format=xlsx" -O dati_forza.xlsx
      - name: Aggiorna strength-dashboard.html
        run: python genera_strength.py dati_forza.xlsx strength-dashboard.html
      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gps-dashboard.html strength-dashboard.html
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento dati GPS e Strength"
            git pull --rebase origin main
            git push
          else
            echo "Nessuna modifica da pubblicare."
          fi
