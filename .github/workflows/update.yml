name: Aggiorna dashboard GPS e Strength da OneDrive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [drive-updated]

permissions:
  contents: write

concurrency:
  group: aggiorna-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install pandas openpyxl

      - name: Scarica file GPS da OneDrive
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_GPS_URL }}
        run: python scarica_onedrive.py "$ONEDRIVE_URL" dati.xlsx

      - name: Genera GPS dashboard e Team
        run: https://1drv.ms/x/c/766ff0e2a8280a5b/IQCK35Ork2MHR6-ov-AoZbosAUTSWFH1WfjjxNRdXnOEnl8?e=aNC8lL
          python genera_html.py dati.xlsx gps-dashboard.html
          python genera_html.py dati.xlsx team-public.html

      - name: Scarica file Strength da OneDrive
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_STRENGTH_URL }}
        run: python scarica_onedrive.py "$ONEDRIVE_URL" dati_forza.xlsx

      - name: Genera Strength dashboard
        run: python genera_strength.py dati_forza.xlsx strength-dashboard.html

      - name: Commit e push se ci sono modifiche
        run: 
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gps-dashboard.html team-public.html strength-dashboard.html
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento dati GPS e Strength"
            git pull --rebase origin main
            git push
          else
            echo "Nessuna modifica da pubblicare."
          fi
